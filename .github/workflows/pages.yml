name: Build firmware and publish website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.1
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Actions starts container steps without running the image entrypoint.
      # Export the preinstalled IDF Python environment and CMake for later steps.
      - name: Activate the container toolchain
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          printf '%s\n' "$(dirname "$(command -v cmake)")" "$(dirname "$(command -v python)")" >> "$GITHUB_PATH"
          python -m pip --version
      - name: Install build-time Python tools
        run: python -m pip install -r requirements-art.txt -r requirements-site.txt
      - name: Acquire pinned firmware dependencies
        run: python scripts/firmware-deps.py
      - name: Check game and native UI
        env:
          POCKET_PREVIEW_ROOT: build/qa-images
        run: bash scripts/check.sh
      - name: Compile the ESP32-S3 RPG
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -B ../build/firmware -D SDKCONFIG="$GITHUB_WORKSPACE/build/firmware/sdkconfig" set-target esp32s3
          idf.py -B ../build/firmware -D SDKCONFIG="$GITHUB_WORKSPACE/build/firmware/sdkconfig" build
      - name: Package website and exact firmware
        run: python scripts/build-site.py --firmware-build build/firmware
      - name: Verify links, integrity, manifest and fail-closed installer
        env:
          POCKET_TEST_BUILD: build/firmware
        run: |
          python scripts/check-site.py --site build/site
          python -m unittest discover -s tests/site -p 'test_*.py'
          node --test tests/site/install.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocketwayfarer-installable-preview
          path: |
            build/site/firmware/
            build/qa-images/lantern/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check one-time Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh api "repos/$REPO/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Enable Settings > Pages > Source: GitHub Actions, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pages.outputs.enabled == 'true'
      - name: Verify public website and firmware downloads
        if: steps.pages.outputs.enabled == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check-published-site.py --base-url "$PAGE_URL" --source-commit "$GITHUB_SHA"
